services:
  mysql:
    image: mariadb:10.11
    restart: unless-stopped
    command: ["mysqld", "--character-set-server=utf8mb4"]
    environment:
      MYSQL_ROOT_PASSWORD: ${TEST_DB_ROOT_PASSWORD:?Set TEST_DB_ROOT_PASSWORD in Portainer}
      MYSQL_DATABASE: openemr
      MYSQL_USER: openemr
      MYSQL_PASSWORD: ${TEST_DB_PASSWORD:?Set TEST_DB_PASSWORD in Portainer}
    volumes:
      - ${TEST_DATA_ROOT:-/var/www/openemr-test}/database:/var/lib/mysql
      - ${SQL_DUMP_HOST_PATH:?Set SQL_DUMP_HOST_PATH to the SQL file path on the Docker host}:/docker-entrypoint-initdb.d/01-restore.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  openemr:
    image: ${OPENEMR_IMAGE:-openemr/openemr:flex}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${OPENEMR_HTTP_PORT:-8088}:80"
      - "${OPENEMR_HTTPS_PORT:-8448}:443"
    volumes:
      - ${OPENEMR_SOURCE_PATH:?Set OPENEMR_SOURCE_PATH to the absolute code checkout path}:/openemr:ro
      - ${OPENEMR_SOURCE_PATH:?Set OPENEMR_SOURCE_PATH to the absolute code checkout path}:/var/www/localhost/htdocs/openemr:rw
      - ${TEST_DATA_ROOT:-/var/www/openemr-test}/assets:/var/www/localhost/htdocs/openemr/public/assets
      - ${TEST_DATA_ROOT:-/var/www/openemr-test}/themes:/var/www/localhost/htdocs/openemr/public/themes
      - ${TEST_DATA_ROOT:-/var/www/openemr-test}/sites:/var/www/localhost/htdocs/openemr/sites
      - ${TEST_DATA_ROOT:-/var/www/openemr-test}/node_modules:/var/www/localhost/htdocs/openemr/node_modules
      - ${TEST_DATA_ROOT:-/var/www/openemr-test}/vendor:/var/www/localhost/htdocs/openemr/vendor
      - ${TEST_DATA_ROOT:-/var/www/openemr-test}/ccda_node_modules:/var/www/localhost/htdocs/openemr/ccdaservice/node_modules
      - ${TEST_DATA_ROOT:-/var/www/openemr-test}/logs:/var/log
    environment:
      MYSQL_HOST: mysql
      MYSQL_ROOT_PASS: ${TEST_DB_ROOT_PASSWORD:?Set TEST_DB_ROOT_PASSWORD in Portainer}
      MYSQL_USER: openemr
      MYSQL_PASS: ${TEST_DB_PASSWORD:?Set TEST_DB_PASSWORD in Portainer}
      OE_USER: ${TEST_OE_USER:-admin}
      OE_PASS: ${TEST_OE_PASSWORD:?Set TEST_OE_PASSWORD in Portainer}
      EASY_DEV_MODE: "yes"
      EASY_DEV_MODE_NEW: "yes"
      OPENEMR_DOCKER_ENV_TAG: portainer-test

